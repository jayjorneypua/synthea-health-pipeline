resources:
  jobs:
    synthea_health_pipeline:
      name: synthea_health_pipeline
      max_concurrent_runs: 1
      # no schedule: Airflow triggers it after the extractor uploads

      email_notifications:
        on_failure:
          - jayjorneypua@gmail.com

      tasks:
        - task_key: bronze_cdc
          notebook_task:
            notebook_path: ../notebooks/01_bronze_cdc.py
            
        - task_key: silver_cdc
          depends_on:
            - task_key: bronze_cdc
          notebook_task:
            notebook_path: ../notebooks/02_silver_cdc.py
            
        - task_key: silver_patient_history
          depends_on:
            - task_key: bronze_cdc
          notebook_task:
            notebook_path: ../notebooks/03_silver_patient_history.py