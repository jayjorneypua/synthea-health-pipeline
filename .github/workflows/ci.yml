# CI/CD: validate the bundle and parse dbt on every PR, deploy the bundle on merge to main.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: validate bundle
        run: databricks bundle validate -t prod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dbt
        run: pip install dbt-databricks

      # parse does not connect to Databricks, the profile only has to be valid
      - name: dbt parse
        working-directory: dbt
        run: |
          mkdir -p ci_profiles
          cat > ci_profiles/profiles.yml <<'EOF'
          ci:
            target: ci
            outputs:
              ci:
                type: databricks
                host: dbc-609647e1-c073.cloud.databricks.com
                http_path: /sql/1.0/warehouses/606b0c60dc21c8fd
                token: "{{ env_var('DATABRICKS_TOKEN') }}"
                catalog: synthea
                schema: gold
                threads: 1
          EOF
          dbt deps
          dbt parse --profiles-dir ci_profiles --profile ci --target ci

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: deploy bundle
        run: databricks bundle deploy -t prod